<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音声文字起こし</title>
<style>
  :root { --bg:#fff7f0; --fg:#222; --accent:#ff7a1a; --card:#fff; --muted:#888; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
         background:var(--bg); color:var(--fg); }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.3rem; margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: .9rem; margin-bottom: 12px; }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px;
          box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  #rec { width:100%; padding:22px; font-size:1.3rem; font-weight:700; border:0; border-radius:14px;
         background:var(--accent); color:#fff; cursor:pointer; }
  #rec.on { background:#d62f2f; }
  #rec:disabled { opacity:.5; }
  .meter { height:10px; background:#eee; border-radius:5px; overflow:hidden; margin-top:12px; }
  .meter > div { height:100%; width:0; background:#2bb673; transition: width .08s; }
  #status { font-size:.9rem; color:var(--muted); margin-top:8px; }
  #phone b { font-size:1.05rem; word-break: break-all; }
  #list { list-style:none; margin:0; padding:0; }
  #list li { padding:8px 0; border-bottom:1px solid #f0e6dd; line-height:1.6; }
  #list .meta { font-size:.75rem; color:var(--muted); }
  .tag { display:inline-block; padding:0 6px; border-radius:6px; background:#ffe3cc; margin-left:4px; }
  .tag.phone { background:#d8ecff; }
  .row { display:flex; gap:8px; justify-content:space-between; align-items:center; }
  button.small { padding:6px 12px; border-radius:8px; border:1px solid #ddd; background:#fff; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>🎙 音声文字起こし</h1>
  <div class="sub" id="where"></div>

  <div class="card">
    <button id="rec" disabled>準備中…</button>
    <div class="meter"><div id="level"></div></div>
    <div id="status"></div>
  </div>

  <div class="card" id="phone" hidden>
    📱 PCにマイクがないときは、同じWi-Fiのスマホでこのアドレスを開いてください<br>
    <b id="phoneUrl"></b><br>
    <small>「安全ではありません」と出たら「詳細」→「アクセスする」でOK。スマホで話した内容もこの画面に出ます。</small>
  </div>

  <div class="card">
    <div class="row">
      <strong>文字起こし結果</strong>
      <button class="small" id="copy">全部コピー</button>
    </div>
    <ul id="list"></ul>
  </div>
</main>

<script>
const isPC = ["localhost", "127.0.0.1"].includes(location.hostname);
const source = isPC ? "pc" : "phone";
document.getElementById("where").textContent =
  isPC ? "このPCのマイクで録音します" : "このスマホのマイクで録音して、PCに送ります";
if (isPC) document.getElementById("phone").hidden = false;

const recBtn = document.getElementById("rec");
const statusEl = document.getElementById("status");
const levelEl = document.getElementById("level");
const listEl = document.getElementById("list");

// ---------- 録音（無音のところで区切って、WAVにしてPCへ送る）
const TARGET_RATE = 16000;
const SILENCE_RMS = 0.012;   // これより小さい音は「無音」扱い
const MIN_SEC = 2.5;         // 最低この長さたまったら、無音で区切る
const MAX_SEC = 15;          // 話し続けてもこの長さで区切る
const SILENCE_SEC = 0.6;     // この長さ無音が続いたら区切る

let ctx, stream, proc, srcNode, wakeLock;
let chunks = [], samples = 0, silence = 0, hadSpeech = false, recording = false;

async function start() {
  if (!navigator.mediaDevices?.getUserMedia) {
    alert("このブラウザではマイクが使えません。スマホは https:// のアドレスで開いてください。");
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 },
    });
  } catch (e) {
    alert("マイクが見つからないか、許可されていません。\n" + e.message);
    return;
  }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  srcNode = ctx.createMediaStreamSource(stream);
  proc = ctx.createScriptProcessor(4096, 1, 1);
  proc.onaudioprocess = (e) => onAudio(e.inputBuffer.getChannelData(0));
  srcNode.connect(proc);
  proc.connect(ctx.destination);
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (_) {}
  recording = true;
  recBtn.textContent = "■ 停止";
  recBtn.classList.add("on");
}

function stop() {
  recording = false;
  flush();
  proc?.disconnect(); srcNode?.disconnect();
  stream?.getTracks().forEach((t) => t.stop());
  ctx?.close();
  wakeLock?.release?.(); wakeLock = null;
  levelEl.style.width = "0";
  recBtn.textContent = "● 録音開始";
  recBtn.classList.remove("on");
}

function onAudio(data) {
  if (!recording) return;
  const block = new Float32Array(data);
  let sum = 0;
  for (let i = 0; i < block.length; i++) sum += block[i] * block[i];
  const rms = Math.sqrt(sum / block.length);
  levelEl.style.width = Math.min(100, rms * 600) + "%";

  chunks.push(block);
  samples += block.length;
  const blockSec = block.length / ctx.sampleRate;
  if (rms > SILENCE_RMS) { hadSpeech = true; silence = 0; } else { silence += blockSec; }

  const sec = samples / ctx.sampleRate;
  if ((sec >= MIN_SEC && silence >= SILENCE_SEC) || sec >= MAX_SEC) flush();
}

function flush() {
  if (!samples || !ctx) return;
  const all = new Float32Array(samples);
  let off = 0;
  for (const c of chunks) { all.set(c, off); off += c.length; }
  const speech = hadSpeech;
  chunks = []; samples = 0; silence = 0; hadSpeech = false;
  if (!speech) return; // 無音だけなら送らない
  const wav = encodeWav(downsample(all, ctx.sampleRate, TARGET_RATE), TARGET_RATE);
  fetch(`/api/audio?source=${source}`, { method: "POST", body: wav, headers: { "Content-Type": "audio/wav" } })
    .catch((e) => { statusEl.textContent = "送信エラー: " + e.message; });
}

function downsample(buf, from, to) {
  if (from === to) return buf;
  const ratio = from / to, out = new Float32Array(Math.floor(buf.length / ratio));
  for (let i = 0; i < out.length; i++) {
    const s = Math.floor(i * ratio), e = Math.min(buf.length, Math.floor((i + 1) * ratio));
    let sum = 0;
    for (let j = s; j < e; j++) sum += buf[j];
    out[i] = sum / Math.max(1, e - s);
  }
  return out;
}

function encodeWav(pcm, rate) {
  const buf = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, "RIFF"); v.setUint32(4, 36 + pcm.length * 2, true); str(8, "WAVE");
  str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, "data"); v.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) {
    const s = Math.max(-1, Math.min(1, pcm[i]));
    v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([buf], { type: "audio/wav" });
}

recBtn.onclick = () => (recording ? stop() : start());

// ---------- 結果の表示（PCでもスマホでも、全員分の結果を表示）
let lastId = 0;
const allText = [];
async function poll() {
  try {
    const r = await fetch(`/api/transcripts?after=${lastId}`);
    const d = await r.json();
    for (const e of d.entries) {
      lastId = e.id;
      allText.push(e.text);
      const li = document.createElement("li");
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.innerHTML = `${e.time}<span class="tag ${e.source === "スマホ" ? "phone" : ""}"></span>`;
      meta.querySelector(".tag").textContent = e.source;
      const body = document.createElement("div");
      body.textContent = e.text;
      li.append(meta, body);
      listEl.prepend(li);
    }
    statusEl.textContent = d.status + (d.pending ? `（処理待ち ${d.pending} 件）` : "");
    document.getElementById("phoneUrl").textContent = d.phone_url;
    if (!recording) {
      recBtn.disabled = !d.ready;
      recBtn.textContent = d.ready ? "● 録音開始" : "準備中…";
    }
  } catch (_) {
    statusEl.textContent = "PCのアプリにつながりません。app.py が動いているか確認してください。";
  }
  setTimeout(poll, 1500);
}
poll();

document.getElementById("copy").onclick = async () => {
  const text = allText.join("\n");
  try { await navigator.clipboard.writeText(text); alert("コピーしました"); }
  catch (_) { prompt("コピーしてください", text); }
};
</script>
</body>
</html>
