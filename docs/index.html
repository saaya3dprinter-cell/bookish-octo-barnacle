<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>音声文字起こし</title>
<style>
  :root { --bg:#fff7f0; --fg:#222; --accent:#ff7a1a; --card:#fff; --muted:#888; --line:#f0e6dd; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1714; --fg:#eee; --card:#26211d; --muted:#aaa; --line:#3a322c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
         background:var(--bg); color:var(--fg); }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.3rem; margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: .9rem; margin-bottom: 12px; }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px;
          box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  #rec { width:100%; padding:22px; font-size:1.3rem; font-weight:700; border:0; border-radius:14px;
         background:var(--accent); color:#fff; cursor:pointer; }
  #rec.on { background:#d62f2f; }
  #rec:disabled { opacity:.5; }
  #transcript { min-height:45vh; max-height:62vh; overflow-y:auto; font-size:1.35rem; line-height:1.8;
                margin-top:10px; padding-right:4px; }
  #transcript p { margin:0 0 10px; }
  #transcript .meta { font-size:.7rem; color:var(--muted); margin-right:6px; vertical-align:middle; }
  #live { color:var(--muted); }
  #live:empty::before { content: attr(data-hint); font-size:1rem; }
  .controls { position:sticky; bottom:0; padding:10px 0 14px; background:var(--bg); }
  .meterRow { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:.85rem; color:var(--muted); }
  .meter { flex:1; height:12px; background:var(--line); border-radius:6px; overflow:hidden; }
  #level { height:100%; width:0; background:#2bb673; border-radius:6px; transition: width .2s ease-out; }
  #level.heard { width:100%; opacity:.45; }
  .docBar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .docBar input, .docBar select, #library select { font:inherit; padding:7px 10px; border-radius:8px;
         border:1px solid #ccc; background:var(--card); color:var(--fg); }
  #docName { flex:1; min-width:180px; font-weight:700; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700; }
  #library summary { cursor:pointer; font-weight:700; }
  .folder { margin-top:14px; }
  .folderHead { display:flex; align-items:center; gap:6px; font-weight:700; padding:6px 0; border-bottom:1px solid var(--line); }
  .folderHead .name { flex:1; }
  .docItem { display:flex; align-items:center; gap:6px; padding:8px 4px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .docItem.current { background:rgba(255,122,26,.12); border-radius:8px; }
  .docItem .open { flex:1; min-width:160px; text-align:left; background:none; border:0; color:var(--fg); cursor:pointer; font:inherit; padding:0; }
  .docItem .info { font-size:.75rem; color:var(--muted); }
  .empty { color:var(--muted); font-size:.85rem; padding:6px 0; }
  #error { background:#ffe1e1; color:#8a1010; padding:10px 12px; border-radius:10px; margin-top:8px; font-size:.95rem; }
  #printArea { display:none; }
  @media print {
    body { background:#fff; color:#000; }
    main { display:none; }
    #printArea { display:block; font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; }
    #printArea h1 { font-size:18pt; margin:0 0 4pt; }
    #printArea .date { font-size:10pt; color:#555; margin-bottom:14pt; }
    #printArea p { font-size:11pt; line-height:1.8; margin:0 0 6pt; }
    #printArea .meta { font-size:8pt; color:#666; margin-right:6pt; }
  }
  #status { font-size:.9rem; color:var(--muted); margin-top:6px; }
  #qr { display:flex; justify-content:center; margin:10px 0; }
  #qr img { background:#fff; padding:8px; border-radius:8px; width:200px; height:200px; image-rendering: pixelated; }
  #phoneLink { font-size:.8rem; word-break: break-all; color: var(--muted); }
  .tag { display:inline-block; padding:0 6px; border-radius:6px; background:#ffe3cc; color:#222; margin-left:4px; }
  .tag.phone { background:#d8ecff; }
  .row { display:flex; gap:8px; justify-content:space-between; align-items:center; flex-wrap:wrap; }
  button.small { padding:6px 12px; border-radius:8px; border:1px solid #ccc; background:var(--card); color:var(--fg); cursor:pointer; }
  .warn { background:#fff1c2; color:#5a4500; padding:10px 12px; border-radius:10px; margin-bottom:14px; }
</style>
</head>
<body>
<main>
  <h1>🎙 音声文字起こし</h1>
  <div class="sub" id="where"></div>
  <div class="warn" id="unsupported" hidden>
    このブラウザには「ブラウザ（簡易）」の音声認識がありません。「AI（高精度）」を使ってください。
  </div>

  <div class="card">
    <div class="docBar">
      <input id="docName" placeholder="文字起こしの名前" aria-label="文字起こしの名前">
      <select id="docFolder" aria-label="入れるフォルダ"></select>
      <button class="small primary" id="newDoc">＋ 新規</button>
    </div>
    <div class="row">
      <span class="sub" id="docInfo" style="margin:0"></span>
      <div>
        <button class="small" id="copy">コピー</button>
        <button class="small" id="word">Word</button>
        <button class="small" id="pdf">PDF</button>
        <button class="small" id="save">.txt</button>
        <button class="small" id="clear">クリア</button>
      </div>
    </div>
    <div id="transcript"><div id="done"></div><p id="live" data-hint="「● 録音開始」を押して話すと、ここに文字がどんどん出てきます"></p></div>
  </div>

  <div class="controls">
    <button id="rec">● 録音開始</button>
    <div class="meterRow" style="margin-top:8px">
      <label for="engine">文字にする方法</label>
      <select id="engine" style="font:inherit;padding:4px 8px;border-radius:8px;border:1px solid #ccc;background:var(--card);color:var(--fg)">
        <option value="ai">AI（高精度・おすすめ）</option>
        <option value="browser">ブラウザ（簡易・Chromeのみ）</option>
      </select>
    </div>
    <div class="meterRow"><span>🎤</span><div class="meter"><div id="level"></div></div><span id="levelText">停止中</span></div>
    <div id="status"></div>
    <div id="error" hidden></div>
  </div>

  <details class="card" id="library">
    <summary>📁 保存した文字起こし（フォルダ）</summary>
    <div class="sub" style="margin:8px 0 0">このブラウザの中に保存されます。名前を押すと開きます。</div>
    <button class="small" id="newFolder" style="margin-top:8px">＋ フォルダを作る</button>
    <div id="folders"></div>
  </details>

  <div class="card" id="pairCard" hidden>
    <strong>📱 スマホをマイクにする</strong>
    <div class="sub" style="margin:6px 0 0">PCにマイクがないときは、スマホのカメラでこのQRコードを読み取ってください。スマホで話した内容がこの画面に出ます。</div>
    <div id="qr"></div>
    <div id="phoneLink"></div>
    <div id="pairStatus" class="sub" style="margin:6px 0 0"></div>
  </div>

</main>
<div id="printArea"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const params = new URLSearchParams(location.search);
const room = params.get("room");           // ?room=xxx があれば「スマホ（マイク役）」モード
const isPhoneMode = !!room;
const $ = (id) => document.getElementById(id);

$("where").textContent = isPhoneMode
  ? "このスマホのマイクで話すと、PCの画面に文字が届きます"
  : "このPCのマイクで録音できます。マイクがないときは下のQRコードでスマホをつなげます";

// ---------------------------------------------------------- 保存データ（フォルダ・文字起こし）
// { folders:[{id,name}], docs:[{id,name,folderId,createdAt,updatedAt,entries:[{time,source,text}]}], currentId }
const DB_KEY = "mojiokoshi-library-v1";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
let lib = null;
try { lib = JSON.parse(localStorage.getItem(DB_KEY) || "null"); } catch (_) {}
if (!lib || !Array.isArray(lib.docs)) lib = { folders: [], docs: [], currentId: null };
// 以前のバージョンの結果があれば1つの文字起こしとして引き継ぐ
try {
  const old = JSON.parse(localStorage.getItem("transcripts-v1") || "[]");
  if (old.length) {
    lib.docs.push({ id: uid(), name: "以前の文字起こし", folderId: "", createdAt: Date.now(), updatedAt: Date.now(), entries: old });
    localStorage.removeItem("transcripts-v1");
  }
} catch (_) {}
function persist() { try { localStorage.setItem(DB_KEY, JSON.stringify(lib)); } catch (_) {} }

function defaultName() {
  const d = new Date();
  return `文字起こし ${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
}
function newDoc(folderId = "") {
  const doc = { id: uid(), name: defaultName(), folderId, createdAt: Date.now(), updatedAt: Date.now(), entries: [] };
  lib.docs.push(doc);
  lib.currentId = doc.id;
  persist();
  return doc;
}
function cur() {
  return lib.docs.find((d) => d.id === lib.currentId) || lib.docs[lib.docs.length - 1] || newDoc();
}
let entries = cur().entries;
lib.currentId = cur().id;

function openDoc(id) {
  lib.currentId = id;
  entries = cur().entries;
  persist();
  setLive("");
  renderAll();
}
function folderName(id) {
  return lib.folders.find((f) => f.id === id)?.name || "未分類";
}
function fmtDate(t) {
  const d = new Date(t);
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
}

function render() {
  $("done").replaceChildren(...entries.map((e) => {
    const para = document.createElement("p");
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = e.time;
    const tag = document.createElement("span");
    tag.className = "tag" + (e.source === "スマホ" ? " phone" : "");
    tag.textContent = e.source;
    meta.append(tag);
    para.append(meta, document.createTextNode(e.text));
    return para;
  }));
  $("docInfo").textContent = `📁 ${folderName(cur().folderId)} ・ ${entries.length}件`;
  scrollToEnd();
}
function renderDocBar() {
  const doc = cur();
  if (document.activeElement !== $("docName")) $("docName").value = doc.name;
  const sel = $("docFolder");
  sel.replaceChildren(
    new Option("📁 未分類", ""),
    ...lib.folders.map((f) => new Option("📁 " + f.name, f.id)),
    new Option("＋ 新しいフォルダ…", "__new"),
  );
  sel.value = doc.folderId || "";
}
function renderLibrary() {
  const groups = [{ id: "", name: "未分類" }, ...lib.folders];
  $("folders").replaceChildren(...groups.map((f) => {
    const box = document.createElement("div");
    box.className = "folder";
    const head = document.createElement("div");
    head.className = "folderHead";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = "📁 " + f.name;
    head.append(name);
    if (f.id) {
      head.append(
        button("名前変更", () => {
          const n = prompt("フォルダの名前", f.name);
          if (n?.trim()) { f.name = n.trim(); persist(); renderAll(); }
        }),
        button("削除", () => {
          if (!confirm(`フォルダ「${f.name}」を削除しますか？\n中の文字起こしは「未分類」に移ります。`)) return;
          lib.docs.forEach((d) => { if (d.folderId === f.id) d.folderId = ""; });
          lib.folders = lib.folders.filter((x) => x !== f);
          persist(); renderAll();
        }),
      );
    }
    box.append(head);
    const docs = lib.docs.filter((d) => (d.folderId || "") === f.id).sort((a, b) => b.updatedAt - a.updatedAt);
    if (!docs.length) {
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = "まだありません";
      box.append(e);
    }
    for (const d of docs) {
      const item = document.createElement("div");
      item.className = "docItem" + (d.id === lib.currentId ? " current" : "");
      const open = document.createElement("button");
      open.className = "open";
      open.textContent = d.name;
      const info = document.createElement("div");
      info.className = "info";
      info.textContent = `${fmtDate(d.updatedAt)} ・ ${d.entries.length}件` + (d.id === lib.currentId ? " ・ 表示中" : "");
      open.append(info);
      open.onclick = () => { openDoc(d.id); window.scrollTo({ top: 0, behavior: "smooth" }); };
      const move = document.createElement("select");
      move.setAttribute("aria-label", "フォルダを移動");
      move.append(new Option("移動…", "__"), new Option("未分類", ""), ...lib.folders.map((x) => new Option(x.name, x.id)));
      move.onchange = () => {
        if (move.value !== "__") { d.folderId = move.value; persist(); renderAll(); }
      };
      item.append(open, move, button("削除", () => {
        if (!confirm(`「${d.name}」を削除しますか？（元に戻せません）`)) return;
        lib.docs = lib.docs.filter((x) => x !== d);
        if (lib.currentId === d.id) { lib.currentId = null; entries = cur().entries; lib.currentId = cur().id; }
        persist(); renderAll();
      }));
      box.append(item);
    }
    return box;
  }));
}
function button(label, onclick) {
  const b = document.createElement("button");
  b.className = "small";
  b.textContent = label;
  b.onclick = onclick;
  return b;
}
function renderAll() { render(); renderDocBar(); renderLibrary(); }

function createFolder() {
  const n = prompt("新しいフォルダの名前（例：お客さん名、作品名）");
  if (!n?.trim()) return null;
  const f = { id: uid(), name: n.trim() };
  lib.folders.push(f);
  persist();
  return f;
}

$("docName").oninput = () => {
  cur().name = $("docName").value.trim() || defaultName();
  persist();
  renderLibrary();
};
$("docName").onblur = () => renderDocBar();
$("docFolder").onchange = () => {
  let id = $("docFolder").value;
  if (id === "__new") id = createFolder()?.id ?? cur().folderId;
  cur().folderId = id;
  persist();
  renderAll();
};
$("newDoc").onclick = () => {
  const doc = newDoc(cur().folderId);  // 今のフォルダに新しく作る
  openDoc(doc.id);
  $("docName").focus();
  $("docName").select();
};
$("newFolder").onclick = () => { if (createFolder()) renderAll(); };

// 話している途中の文字（まだ確定していない部分）をそのまま表示
function setLive(text) {
  $("live").textContent = text;
  scrollToEnd();
}
function scrollToEnd() {
  const box = $("transcript");
  box.scrollTop = box.scrollHeight;
}
function addEntry(source, text) {
  text = text.trim();
  if (!text) return;
  entries.push({ time: new Date().toLocaleTimeString("ja-JP"), source, text });
  cur().updatedAt = Date.now();
  persist();
  render();
  renderLibrary();
}
renderAll();

$("copy").onclick = async () => {
  const text = entries.map((e) => e.text).join("\n");
  try { await navigator.clipboard.writeText(text); alert("コピーしました"); }
  catch (_) { prompt("コピーしてください", text); }
};
// ---------------------------------------------------------- 出力（txt / Word / PDF）
function downloadBlob(blob, filename) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
// ファイル名に使えない記号を消す
function fileBase() {
  return cur().name.replace(/[\\/:*?"<>|]/g, "_").trim() || "mojiokoshi";
}
function hasEntries() {
  if (entries.length) return true;
  alert("まだ文字起こしがありません");
  return false;
}

$("save").onclick = () => {
  if (!hasEntries()) return;
  const text = entries.map((e) => `[${e.time}] (${e.source}) ${e.text}`).join("\n");
  downloadBlob(new Blob([text], { type: "text/plain" }), `${fileBase()}.txt`);
};

// Word（.docx）: ライブラリは大きいので、ボタンを押したときだけ読み込む
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = src;
    el.onload = resolve;
    el.onerror = () => reject(new Error("読み込み失敗"));
    document.head.append(el);
  });
}
$("word").onclick = async () => {
  if (!hasEntries()) return;
  const btn = $("word");
  btn.disabled = true;
  btn.textContent = "作成中…";
  try {
    if (!window.docx) await loadScript("https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js");
    const { Document, Packer, Paragraph, TextRun, HeadingLevel } = window.docx;
    const font = { ascii: "Yu Gothic", eastAsia: "Yu Gothic", hAnsi: "Yu Gothic" };
    const doc = new Document({
      styles: { default: { document: { run: { font, size: 22 } } } },
      sections: [{
        children: [
          new Paragraph({ heading: HeadingLevel.HEADING_1, children: [new TextRun({ text: cur().name, font })] }),
          new Paragraph({ children: [new TextRun({ text: `${fmtDate(cur().createdAt)} ・ ${folderName(cur().folderId)}`, color: "666666", size: 20 })] }),
          new Paragraph({}),
          ...entries.map((e) => new Paragraph({
            spacing: { after: 120 },
            children: [
              new TextRun({ text: `${e.time} ${e.source}  `, color: "888888", size: 16 }),
              new TextRun({ text: e.text }),
            ],
          })),
        ],
      }],
    });
    downloadBlob(await Packer.toBlob(doc), `${fileBase()}.docx`);
  } catch (err) {
    alert("Wordファイルを作れませんでした: " + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Word";
  }
};

// PDF: 印刷画面を開く →「送信先」で「PDFに保存」を選ぶ（日本語もきれいに出せる）
$("pdf").onclick = () => {
  if (!hasEntries()) return;
  const area = $("printArea");
  const h1 = document.createElement("h1");
  h1.textContent = cur().name;
  const date = document.createElement("div");
  date.className = "date";
  date.textContent = `${fmtDate(cur().createdAt)} ・ ${folderName(cur().folderId)}`;
  area.replaceChildren(h1, date, ...entries.map((e) => {
    const para = document.createElement("p");
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = `${e.time} ${e.source}`;
    para.append(meta, document.createTextNode(e.text));
    return para;
  }));
  const oldTitle = document.title;
  document.title = fileBase();  // PDFのファイル名になる
  window.print();
  document.title = oldTitle;
};
$("clear").onclick = () => {
  if (confirm(`「${cur().name}」の中身を全部消しますか？`)) { entries.length = 0; persist(); renderAll(); }
};

// ---------------------------------------------------------- 録音の共通部分
// 文字にする方法は2つ
//   ai      : 録音した声を Cloudflare の AI（Whisper）に送る。高精度・どのブラウザでもOK・スマホで音が鳴らない
//   browser : ブラウザ標準の音声認識（Chrome など）。AI の無料分を使い切った日の予備
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
let recording = false, wakeLock = null;
let onFinal = (text) => addEntry("PC", text);
let onInterim = () => {};
let engine = "ai";
try { engine = localStorage.getItem("mojiokoshi-engine") || "ai"; } catch (_) {}
if (engine === "browser" && !SR) engine = "ai";
$("engine").value = engine;
$("engine").onchange = () => {
  const wasRecording = recording;
  if (wasRecording) stopRec();
  engine = $("engine").value;
  try { localStorage.setItem("mojiokoshi-engine", engine); } catch (_) {}
  if (engine === "browser" && !SR) $("unsupported").hidden = false;
  if (wasRecording) startRec();
};

function setLevelText(t) { $("levelText").textContent = t; }
function showError(msg) {
  $("error").textContent = "⚠ " + msg;
  $("error").hidden = !msg;
}
function startRec() {
  showError("");
  recording = true;
  $("rec").textContent = "■ 停止";
  $("rec").classList.add("on");
  $("status").textContent = "マイクを準備中…";
  navigator.wakeLock?.request("screen").then((l) => (wakeLock = l)).catch(() => {});
  if (engine === "ai") startAi(); else startBrowser();
}
function stopRec() {
  recording = false;
  stopAi();
  stopBrowser();
  $("rec").textContent = "● 録音開始";
  $("rec").classList.remove("on");
  if (!aiPending) setLive("");
  $("status").textContent = "";
  onInterim("");
  wakeLock?.release?.(); wakeLock = null;
  $("level").classList.remove("heard");
  $("level").style.width = "0";
  setLevelText("停止中");
}
$("rec").onclick = () => (recording ? stopRec() : startRec());

// AI が使えないとき（無料分を使い切った日など）はブラウザの音声認識に切り替える
function fallbackToBrowser(reason) {
  const wasRecording = recording;
  if (wasRecording) stopRec();
  if (!SR) {
    showError(reason + " このブラウザには予備の音声認識もないため、明日また使えるようになるまでお待ちください。");
    return;
  }
  engine = "browser";
  $("engine").value = "browser";
  showError(reason + " ブラウザの音声認識（簡易）に切り替えました。");
  if (wasRecording) { startRec(); showError(reason + " ブラウザの音声認識（簡易）に切り替えました。"); }
}

// ---------------------------------------------------------- AI（Whisper）で文字起こし
// 声を録音して、話の切れ目（無音）で区切って、WAVにしてサーバーへ送る
const TARGET_RATE = 16000;
const SILENCE_RMS = 0.012;   // これより小さい音は「無音」扱い
const MIN_SEC = 2.5;         // 最低この長さたまったら、無音で区切る
const MAX_SEC = 15;          // 話し続けてもこの長さで区切る
const SILENCE_SEC = 0.7;     // この長さ無音が続いたら区切る

let ai = null;          // 録音中の音声まわり
let aiQueue = Promise.resolve();
let aiPending = 0;

async function startAi() {
  if (!navigator.mediaDevices?.getUserMedia) {
    showError("このブラウザではマイクが使えません。");
    stopRec();
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 },
    });
  } catch (e) {
    showError(e.name === "NotFoundError"
      ? "マイクが見つかりません。マイクをつなぐか、下のQRコードでスマホをマイクにしてください。"
      : "マイクが許可されていません。アドレスバー左のアイコン →「マイク」を「許可」にして、ページを再読み込みしてください。");
    stopRec();
    return;
  }
  if (!recording) { stream.getTracks().forEach((t) => t.stop()); return; }
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  const src = ctx.createMediaStreamSource(stream);
  const proc = ctx.createScriptProcessor(4096, 1, 1);
  ai = { stream, ctx, src, proc, chunks: [], samples: 0, silence: 0, hadSpeech: false, level: 0, quietSince: performance.now() };
  proc.onaudioprocess = (e) => onAiAudio(e.inputBuffer.getChannelData(0));
  src.connect(proc);
  proc.connect(ctx.destination);
  $("status").textContent = "聞き取り中…（ひと区切り話すと文字になります）";
}
function stopAi() {
  if (!ai) return;
  flushAi();
  ai.proc.disconnect();
  ai.src.disconnect();
  ai.stream.getTracks().forEach((t) => t.stop());
  ai.ctx.close();
  ai = null;
}
function onAiAudio(data) {
  if (!ai) return;
  const block = new Float32Array(data);
  let sum = 0;
  for (let i = 0; i < block.length; i++) sum += block[i] * block[i];
  const rms = Math.sqrt(sum / block.length);

  // 音のバー
  ai.level = ai.level * 0.6 + rms * 0.4;
  $("level").style.width = Math.min(100, ai.level * 900) + "%";
  const now = performance.now();
  if (rms > SILENCE_RMS) { ai.quietSince = now; setLevelText("音が入っています"); }
  else if (now - ai.quietSince > 3000) setLevelText("音が聞こえません");

  // 話の切れ目で区切る
  ai.chunks.push(block);
  ai.samples += block.length;
  if (rms > SILENCE_RMS) { ai.hadSpeech = true; ai.silence = 0; } else { ai.silence += block.length / ai.ctx.sampleRate; }
  const sec = ai.samples / ai.ctx.sampleRate;
  if ((sec >= MIN_SEC && ai.silence >= SILENCE_SEC) || sec >= MAX_SEC) flushAi();
}
function flushAi() {
  if (!ai || !ai.samples) return;
  const all = new Float32Array(ai.samples);
  let off = 0;
  for (const c of ai.chunks) { all.set(c, off); off += c.length; }
  const speech = ai.hadSpeech;
  const rate = ai.ctx.sampleRate;
  ai.chunks = []; ai.samples = 0; ai.silence = 0; ai.hadSpeech = false;
  if (!speech) return; // 無音だけなら送らない
  sendToAi(encodeWav(downsample(all, rate, TARGET_RATE), TARGET_RATE));
}
function sendToAi(wav) {
  aiPending++;
  showPending();
  // 順番が入れ替わらないように1つずつ送る
  aiQueue = aiQueue.then(async () => {
    try {
      const res = await fetch("/api/transcribe", { method: "POST", body: wav, headers: { "Content-Type": "audio/wav" } });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        if (data.text) onFinal(data.text);
      } else if (data.error === "quota") {
        fallbackToBrowser("今日のAIの無料分を使い切りました（料金はかかりません。明日また使えます）。");
      } else if (res.status === 404 || res.status === 405) {
        fallbackToBrowser("AIの文字起こしがまだ準備できていません。");
      } else {
        showError("AIの文字起こしでエラーが起きました: " + (data.message || res.status));
      }
    } catch (_) {
      showError("サーバーにつながりません。ネット接続を確認してください。");
    } finally {
      aiPending--;
      showPending();
    }
  });
}
function showPending() {
  const t = aiPending ? "✍ 文字にしています…" : "";
  setLive(t);
  onInterim(t);
}
function downsample(buf, from, to) {
  if (from === to) return buf;
  const ratio = from / to, out = new Float32Array(Math.floor(buf.length / ratio));
  for (let i = 0; i < out.length; i++) {
    const st = Math.floor(i * ratio), en = Math.min(buf.length, Math.floor((i + 1) * ratio));
    let sum = 0;
    for (let j = st; j < en; j++) sum += buf[j];
    out[i] = sum / Math.max(1, en - st);
  }
  return out;
}
function encodeWav(pcm, rate) {
  const buf = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(buf);
  const str = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  str(0, "RIFF"); v.setUint32(4, 36 + pcm.length * 2, true); str(8, "WAVE");
  str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, "data"); v.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) {
    const x = Math.max(-1, Math.min(1, pcm[i]));
    v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7fff, true);
  }
  return new Blob([buf], { type: "audio/wav" });
}

// ---------------------------------------------------------- ブラウザ標準の音声認識（予備）
let recog = null, meter = null;
function startBrowser() {
  if (!SR) { $("unsupported").hidden = false; stopRec(); return; }
  recog = new SR();
  recog.lang = "ja-JP";
  recog.continuous = true;
  recog.interimResults = true;
  recog.onresult = (ev) => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) onFinal(r[0].transcript);
      else interim += r[0].transcript;
    }
    setLive(interim);
    onInterim(interim);
  };
  recog.onstart = () => { $("status").textContent = "聞き取り中…（話すと文字になります）"; };
  recog.onspeechstart = () => { $("status").textContent = "声を認識しています…"; };
  recog.onerror = (ev) => {
    if (ev.error === "no-speech" || ev.error === "aborted") return;
    const messages = {
      "not-allowed": "マイクが許可されていません。アドレスバー左のアイコン →「マイク」を「許可」にして、ページを再読み込みしてください。",
      "service-not-allowed": "このブラウザでは音声認識が使えません。PCは Google Chrome で開いてください。",
      "audio-capture": "マイクが見つかりません。マイクをつなぐか、下のQRコードでスマホをマイクにしてください。",
      "network": "音声認識のサーバーにつながりません。ネット接続を確認してください。",
      "language-not-supported": "このブラウザは日本語の音声認識に対応していません。Google Chrome で開いてください。",
    };
    showError(messages[ev.error] || "音声認識エラー: " + ev.error);
    stopRec();
  };
  if (isMobile) {
    recog.onsoundstart = () => { $("level").classList.add("heard"); setLevelText("音が入っています"); };
    recog.onsoundend = () => { $("level").classList.remove("heard"); setLevelText("待機中"); };
  }
  // 無音が続くとブラウザが勝手に止めるので、録音中なら自動で再開する
  recog.onend = () => { if (recording && engine === "browser") setTimeout(() => { try { recog.start(); } catch (_) {} }, 250); };
  recog.start();
  startMeter();
}
function stopBrowser() {
  if (recog) { try { recog.stop(); } catch (_) {} recog = null; }
  stopMeter();
}
// 音のバー（スマホは音声認識とマイク計測を同時に使うと止まることがあるので、PCだけ）
async function startMeter() {
  if (isMobile) { setLevelText("待機中"); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    if (!recording) { stream.getTracks().forEach((t) => t.stop()); return; }
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    ctx.createMediaStreamSource(stream).connect(analyser);
    const buf = new Float32Array(analyser.fftSize);
    meter = { stream, ctx, raf: 0, level: 0, quietSince: performance.now() };
    const tick = () => {
      if (!meter) return;
      analyser.getFloatTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
      const rms = Math.sqrt(sum / buf.length);
      meter.level = meter.level * 0.9 + rms * 0.1;
      $("level").style.width = Math.min(100, meter.level * 900) + "%";
      const now = performance.now();
      if (rms > 0.02) { meter.quietSince = now; setLevelText("音が入っています"); }
      else if (now - meter.quietSince > 3000) setLevelText("音が聞こえません");
      meter.raf = requestAnimationFrame(tick);
    };
    tick();
  } catch (_) {
    setLevelText("バー表示できません");
  }
}
function stopMeter() {
  if (!meter) return;
  cancelAnimationFrame(meter.raf);
  meter.stream.getTracks().forEach((t) => t.stop());
  meter.ctx.close();
  meter = null;
}

// ---------------------------------------------------------- スマホ ⇔ PC 接続（WebRTC / PeerJS）
const PREFIX = "saaya-transcribe-";

if (typeof Peer === "undefined" || typeof qrcode === "undefined") {
  // 通信用のライブラリが読み込めなくても、このPCだけでの録音はできる
  $("status").textContent = "スマホ接続の準備ができませんでした（ネット接続を確認して再読み込みしてください）";
} else if (!isPhoneMode) {
  // PC側: 受信の窓口をつくってQRコードを表示
  $("pairCard").hidden = false;
  const id = PREFIX + Math.random().toString(36).slice(2, 10);
  const peer = new Peer(id);
  const phoneUrl = location.origin + location.pathname + "?room=" + id.slice(PREFIX.length);
  const qr = qrcode(0, "M");
  qr.addData(phoneUrl);
  qr.make();
  $("qr").innerHTML = qr.createImgTag(6, 8);
  $("phoneLink").textContent = phoneUrl;
  $("pairStatus").textContent = "スマホの接続を待っています…";
  peer.on("connection", (conn) => {
    conn.on("open", () => { $("pairStatus").textContent = "✅ スマホがつながりました"; });
    conn.on("data", (msg) => {
      if (msg?.type === "final") { addEntry("スマホ", String(msg.text)); setLive(""); }
      if (msg?.type === "interim") setLive(String(msg.text));
    });
    conn.on("close", () => { $("pairStatus").textContent = "スマホの接続が切れました。もう一度QRコードを読み取ってください。"; });
  });
  peer.on("error", (e) => { $("pairStatus").textContent = "接続の準備でエラー: " + e.type + "（ページを再読み込みしてください）"; });
} else {
  // スマホ側: PCにつないで、認識した文字を送る
  let conn = null;
  const peer = new Peer();
  const setStatus = (t) => { if (!recording) $("status").textContent = t; };
  setStatus("PCに接続中…");
  peer.on("open", () => {
    conn = peer.connect(PREFIX + room, { reliable: true });
    conn.on("open", () => setStatus("✅ PCにつながりました。録音開始を押して話してください"));
    conn.on("close", () => { $("status").textContent = "PCとの接続が切れました。PCのQRコードをもう一度読み取ってください。"; });
  });
  peer.on("error", (e) => {
    $("status").textContent = e.type === "peer-unavailable"
      ? "PCが見つかりません。PCでページを開いたまま、QRコードを読み取り直してください。"
      : "接続エラー: " + e.type;
  });
  onFinal = (text) => {
    addEntry("スマホ", text);
    if (conn?.open) conn.send({ type: "final", text });
  };
  onInterim = (text) => { if (conn?.open) conn.send({ type: "interim", text }); };
}
